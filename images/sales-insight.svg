<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1b2d"/>
      <stop offset="100%" stop-color="#17263d"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#36d1c4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>

  <g stroke="#243a58" stroke-width="1" opacity="0.5">
    <line x1="0" y1="169" x2="1200" y2="169"/>
    <line x1="0" y1="338" x2="1200" y2="338"/>
    <line x1="0" y1="507" x2="1200" y2="507"/>
  </g>

  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="bold">Sales Insight</text>
  <text x="600" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8fa3c2">Plateforme de Sales Intelligence B2B</text>

  <!-- three company nodes feeding into a funnel -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(160,190)">
      <rect width="130" height="60" rx="10" fill="#1b2b44" stroke="#3a5172" stroke-width="3"/>
      <text x="65" y="26" text-anchor="middle" font-size="13" fill="#cfe0f7">Entreprise A</text>
      <text x="65" y="44" text-anchor="middle" font-size="11" fill="#7f93b0">Données brutes</text>
    </g>
    <g transform="translate(160,280)">
      <rect width="130" height="60" rx="10" fill="#1b2b44" stroke="#3a5172" stroke-width="3"/>
      <text x="65" y="26" text-anchor="middle" font-size="13" fill="#cfe0f7">Entreprise B</text>
      <text x="65" y="44" text-anchor="middle" font-size="11" fill="#7f93b0">Signaux d'achat</text>
    </g>
    <g transform="translate(160,370)">
      <rect width="130" height="60" rx="10" fill="#1b2b44" stroke="#3a5172" stroke-width="3"/>
      <text x="65" y="26" text-anchor="middle" font-size="13" fill="#cfe0f7">Entreprise C</text>
      <text x="65" y="44" text-anchor="middle" font-size="11" fill="#7f93b0">Présence digitale</text>
    </g>
  </g>

  <!-- arrows to scoring engine -->
  <g stroke="url(#accent2)" stroke-width="3" fill="none" opacity="0.8">
    <path d="M290,220 L480,300"/>
    <path d="M290,310 L480,310"/>
    <path d="M290,400 L480,320"/>
  </g>

  <!-- scoring engine hub -->
  <g transform="translate(480,255)">
    <circle cx="60" cy="55" r="75" fill="#14233a" stroke="url(#accent2)" stroke-width="4"/>
    <text x="60" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Scoring</text>
    <text x="60" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold">Explicable</text>
  </g>

  <!-- arrow to recommendation -->
  <path d="M655,310 L800,310" stroke="url(#accent2)" stroke-width="3" fill="none"/>

  <g transform="translate(800,255)">
    <rect width="170" height="110" rx="14" fill="#152339" stroke="#3a5172" stroke-width="3"/>
    <text x="85" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Recommandation</text>
    <text x="85" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8fa3c2">Service le plus</text>
    <text x="85" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8fa3c2">pertinent</text>
  </g>

  <!-- conversational assistant bubble -->
  <g transform="translate(1000,380)">
    <path d="M0,20 Q0,0 20,0 L140,0 Q160,0 160,20 L160,60 Q160,80 140,80 L40,80 L15,100 L20,80 L20,80 Q0,80 0,60 Z" fill="#1b2b44" stroke="url(#accent2)" stroke-width="3"/>
    <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Assistant</text>
    <text x="80" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8fa3c2">LLM local</text>
  </g>
  <path d="M885,320 L1000,400" stroke="url(#accent2)" stroke-width="3" fill="none" stroke-dasharray="5,5"/>

  <text x="600" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5d7493">Collecte • Scoring explicable • Recommandation • Assistant conversationnel (LLM local)</text>
</svg>
